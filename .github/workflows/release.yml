# Release when a version tag (`vX.Y.Z`, or `vX.Y.ZaN`, `vX.Y.ZbN`, `vX.Y.ZrcN`
# for pre-releases) is pushed: check the tag (signed, annotated, on `main`), the
# versions in `pom.xml` and `CITATION.cff`, the curated release notes
# (`docs/releases/<version>.md`), and that CI passed for its commit, build the
# image and push it by digest, untagged (`push`), scan exactly that digest in a
# job of its own, without the release credentials and signing identity
# (`scan`), and only then attest its build provenance, sign it (Sigstore
# keyless signing) and tag it `X.Y.Z` (and `latest`, for the highest stable
# release; `release-image`). Tags of other releases are never touched. Then
# create the GitHub release, with the curated notes followed by GitHub's
# generated notes (`publish`, shared action
# `elixir-cloud-aai/.github/actions/publish-release`), and, independently of
# it, tell Pubgrade about the image (`notify`), if it is configured. See
# "Versioning and releases" in `docs/development.md`.
#
# `push` and `release-image` each need approval in the `release` environment
# (required reviewer), and so does `notify` if Pubgrade is configured.
#
# Re-running failed jobs reuses the digest already pushed. Re-running all jobs
# builds a new digest, which `release-image` refuses, before attesting and
# signing it, if `X.Y.Z` already points to another one: published versions
# never change. Only admins can create `v*` tags, and nobody can move or delete
# them (tag rulesets of the repository). `release-image` and `publish` each run
# one release at a time; a newer release waiting for one of them can cancel an
# older one that waits too (one pending job per concurrency group): re-run the
# failed jobs of that run.
# `prepare` fails if a published release of the tag exists already (it can't
# see drafts); `publish` fails on a draft of the tag, and on a published
# release unless an earlier attempt created it (same curated notes, title and
# pre-release flag), so re-run only the failed jobs.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Fully qualified (`docker.io/`), as the attestation needs it. The Docker Hub
# organization is the repository variable `DOCKERHUB_ORG` (by default
# `elixircloud`), for forks that publish to another organization
env:
  IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/tesk-api

# One run per tag, so that a run waiting for approval is not cancelled by the
# run of another tag
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # read the CI runs of the release commit
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and all tags, to check that the release commit is on
          # `main`
          fetch-depth: 0
      # Guards against accidental releases, e.g., of unmerged commits; the
      # `release` environment's protection rules (required reviewer) are what
      # actually control publishing
      - name: Check release tag and commit
        id: version
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)((a|b|rc)[0-9]+)?$ ]]; then
              echo "::error::Tag '${TAG}' is not a release version (vX.Y.Z, or vX.Y.ZaN, vX.Y.ZbN, vX.Y.ZrcN for pre-releases)"
              exit 1
          fi
          base="${BASH_REMATCH[1]}"
          pom="$(python3 -c 'import xml.etree.ElementTree as e; print(e.parse("pom.xml").getroot().find("{http://maven.apache.org/POM/4.0.0}version").text)')"
          if [[ "${pom}" != "${base}" ]]; then
              echo "::error::Version in pom.xml is '${pom}', expected '${base}'"
              exit 1
          fi
          # Annotated, with a signature that GitHub verified
          if [[ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]]; then
              echo "::error::Tag '${TAG}' is not annotated (git tag -s)"
              exit 1
          fi
          verified="$(gh api "repos/${REPOSITORY}/git/tags/$(git rev-parse "refs/tags/${TAG}")" \
              --jq .verification.verified)"
          if [[ "${verified}" != "true" ]]; then
              echo "::error::Tag '${TAG}' has no signature verified by GitHub (git tag -s)"
              exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::Release commit is not on 'main'"
              exit 1
          fi
          {
              echo "version=${TAG#v}"
              echo "sha=$(git rev-parse HEAD)"
          } >> "${GITHUB_OUTPUT}"
      # Zenodo archives the release with the citation metadata of the tagged
      # commit, so `CITATION.cff` must have the release version (set with the
      # version in `pom.xml`, in the release-prep pull request)
      - name: Check citation metadata
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cff="$(sed -En "s/^version:[[:space:]]*[\"']?([0-9A-Za-z.+-]+)[\"']?[[:space:]]*(#.*)?$/\1/p" CITATION.cff)"
          if [[ -z "${cff}" ]]; then
              echo "::error::CITATION.cff has no version: line; set it to '${VERSION}'"
              exit 1
          fi
          if [[ "${cff}" != "${VERSION}" ]]; then
              echo "::error::Version in CITATION.cff is '${cff}', expected '${VERSION}'"
              exit 1
          fi
      # The GitHub release (`publish`) starts with the curated notes of the
      # tagged commit, so they must exist and be in the organization's format
      # before anything is published
      - name: Check release notes
        uses: elixir-cloud-aai/.github/actions/publish-release@31f22fccc1f3c597ed7c1d1f75b2f85522155348 # v1.1.0
        with:
          notes: docs/releases/${{ steps.version.outputs.version }}.md
          commit: ${{ steps.version.outputs.sha }}
          check-only: "true"
      # The checks above don't run the tests: require a successful run of the
      # CI workflow for a push of the release commit (to `dev`, before it moved
      # to `main`); runs for pull requests test merge commits, not the commit
      # itself. Re-runs that succeeded count
      - name: Check that CI passed for the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          runs="$(gh api "repos/${REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&status=success&per_page=1" \
              --jq .total_count)"
          if [[ ! "${runs}" =~ ^[0-9]+$ || "${runs}" -lt 1 ]]; then
              echo "::error::No successful run of the CI workflow (ci.yml) for a push of ${SHA}; once CI passed for it, re-run this workflow"
              exit 1
          fi

  # Builds the image of the release commit once and pushes it by digest only
  # (untagged, with SBOM and provenance attestations), for `scan` to scan and
  # `release-image` to sign and tag. Digests of runs that fail are never signed
  # or tagged, but stay on Docker Hub, untagged
  push:
    name: Push release image
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Docker Hub secrets (required reviewer)
    environment: release
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # OCI labels with the version, commit and source; `tags` only sets the
      # version label (the image is tagged by digest in `release-image`, after
      # the scan)
      - name: Generate image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: type=raw,value=${{ needs.prepare.outputs.version }}
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
          labels: ${{ steps.meta.outputs.labels }}

  # Scans exactly the pushed digest (public, so pulling it needs no login) with
  # Trivy (shared action `elixir-cloud-aai/.github/actions/scan-image`; fails on
  # fixable critical and high vulnerabilities, except those accepted in
  # `.trivyignore.yaml`), so that vulnerabilities published since CI scanned the
  # commit block the release. Kept apart from `push` and `release-image`, so
  # that Trivy never runs next to the Docker Hub credentials and the signing
  # identity
  scan:
    name: Scan release image
    needs: [prepare, push]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Check image digest
        env:
          DIGEST: ${{ needs.push.outputs.digest }}
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid image digest '${DIGEST}'"
              exit 1
          fi
      - name: Scan image
        uses: elixir-cloud-aai/.github/actions/scan-image@31f22fccc1f3c597ed7c1d1f75b2f85522155348 # v1.1.0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ needs.push.outputs.digest }}
          category: release
          upload: "false"

  release-image:
    name: Release image
    needs: [prepare, push, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    # One release at a time, so that `latest` is decided and written in one go
    concurrency:
      group: ${{ github.workflow }}-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Sigstore signing certificates
      attestations: write # GitHub artifact attestations
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      DIGEST: ${{ needs.push.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
          # All tags and `main`, to determine the highest release
          fetch-depth: 0
      - name: Check image digest
        run: |
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid image digest '${DIGEST}'"
              exit 1
          fi
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # A published version never moves to another digest (e.g., after
      # "Re-run all jobs"): checked before attesting and signing, and failing
      # on any error other than a missing tag, so that a registry error can't
      # let it through
      - name: Check that the version is not published yet
        run: |
          if out="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" \
              --format '{{ json .Manifest }}' 2> inspect-error.txt)"; then
              existing="$(jq -r .digest <<< "${out}")"
              if [[ "${existing}" != "${DIGEST}" ]]; then
                  echo "::error::${IMAGE_NAME}:${VERSION} already exists with digest ${existing}"
                  exit 1
              fi
          elif ! grep -qi "not found" inspect-error.txt; then
              cat inspect-error.txt
              echo "::error::Could not check whether ${IMAGE_NAME}:${VERSION} exists"
              exit 1
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
          # No artifact metadata storage record (needs another permission)
          create-storage-record: false
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      # The signature covers the digest, and so every tag of it
      - name: Sign image
        run: cosign sign --yes "${IMAGE_NAME}@${DIGEST}"
      # `X.Y.Z` and, for the highest stable release, `latest` point to the
      # scanned and signed digest. Decided last, from freshly fetched tags, so
      # that a re-run of an older release doesn't move `latest` back; only tags
      # on `main` count
      - name: Tag image
        run: |
          git fetch --quiet --force --tags origin \
              "+refs/heads/main:refs/remotes/origin/main"
          highest="$(git tag --merged origin/main --list 'v*' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          tags=("${IMAGE_NAME}:${VERSION}")
          if [[ "v${VERSION}" == "${highest}" ]]; then
              tags+=("${IMAGE_NAME}:latest")
          fi
          for tag in "${tags[@]}"; do
              docker buildx imagetools create --tag "${tag}" "${IMAGE_NAME}@${DIGEST}"
              actual="$(docker buildx imagetools inspect "${tag}" \
                  --format '{{ json .Manifest }}' | jq -r .digest)"
              if [[ "${actual}" != "${DIGEST}" ]]; then
                  echo "::error::${tag} points to ${actual}, expected ${DIGEST}"
                  exit 1
              fi
          done

  # Creates the GitHub release of the tag once the image is published: the
  # curated notes of the tagged commit (`docs/releases/<version>.md`), then
  # GitHub's generated notes, with the `**Full Changelog**` line last; a
  # pre-release for versions below 1.0.0 and `a`, `b` and `rc` versions. No
  # environment: it needs no secrets, only `contents: write`. The tag must still
  # point to the release commit. Fails on a draft of the tag, and on a published
  # release unless an earlier attempt of this job created it (then it passes
  # without changes). One at a time, so that `latest` is decided in order; a
  # cancelled pending run (see the header) is re-run like a failed one
  publish:
    name: Publish release
    needs: [prepare, release-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-publish-release
      cancel-in-progress: false
    permissions:
      contents: write # create the release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Create release
        uses: elixir-cloud-aai/.github/actions/publish-release@31f22fccc1f3c597ed7c1d1f75b2f85522155348 # v1.1.0
        with:
          notes: docs/releases/${{ needs.prepare.outputs.version }}.md
          commit: ${{ needs.prepare.outputs.sha }}

  # One call to Pubgrade (publish mode, elixir-cloud-aai/Pubgrade#33), which
  # notifies the subscribed deployments of the published image; it doesn't wait
  # for the GitHub release (`publish`). No retries: a failed run says so, and
  # re-running this job sends it again. The token is a secret of the `release`
  # environment, like the other release credentials, so this job needs an
  # approval there, too. The job only runs if the variable `PUBGRADE_URL` is
  # set for the repository: variables of an environment aren't visible to a
  # job's `if:` (it is evaluated before the job enters the environment), and a
  # check in a step would leave every release without Pubgrade waiting for an
  # approval that serves nothing. The step fails if `PUBGRADE_REPOSITORY_ID` or
  # `PUBGRADE_TOKEN` is missing. See "Versioning and releases" in
  # `docs/development.md` for where to set them.
  notify:
    name: Notify Pubgrade
    needs: [prepare, release-image]
    if: vars.PUBGRADE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions: {}
    env:
      PUBGRADE_URL: ${{ vars.PUBGRADE_URL }}
      PUBGRADE_REPOSITORY_ID: ${{ vars.PUBGRADE_REPOSITORY_ID }}
      PUBGRADE_TOKEN: ${{ secrets.PUBGRADE_TOKEN }}
      IMAGE_REPOSITORY: ${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/tesk-api
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Notify Pubgrade
        run: |
          if [[ -z "${PUBGRADE_REPOSITORY_ID}" || -z "${PUBGRADE_TOKEN}" ]]; then
              echo "::error::PUBGRADE_URL is set, but PUBGRADE_REPOSITORY_ID or PUBGRADE_TOKEN is missing"
              exit 1
          fi
          if [[ ! "${PUBGRADE_REPOSITORY_ID}" =~ ^[A-Za-z0-9_-]+$ ]]; then
              echo "::error::Invalid PUBGRADE_REPOSITORY_ID"
              exit 1
          fi
          body="$(jq --null-input \
              --arg name "${IMAGE_REPOSITORY}:${VERSION}" --arg tag "${TAG}" \
              '{images: [{name: $name}], head_commit: {tag: $tag}}')"
          # HTTPS only (also for redirects, which aren't followed anyway); the
          # token goes in through stdin, not the command line
          curl --proto '=https' --silent --show-error --fail-with-body --max-time 300 \
              --request POST "${PUBGRADE_URL%/}/repositories/${PUBGRADE_REPOSITORY_ID}/builds" \
              --header 'Content-Type: application/json' \
              --data "${body}" \
              --config - <<< "header = \"X-Project-Access-Token: ${PUBGRADE_TOKEN}\""
