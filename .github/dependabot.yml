version: 2
# No entry sets `target-branch`: pull requests go to the default branch
# (`dev`) anyway, and while `target-branch` is set, GitHub doesn't apply
# the entry's options (`labels`, `ignore`, ...) to security updates
updates:
  # Dependencies in `pom.xml`. Spring Boot 2 stays until the move to Spring
  # Boot 3, which needs code changes
  - package-ecosystem: maven
    labels: ["type: dependencies"]
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: org.springframework.boot:*
        update-types: ["version-update:semver-major"]
      # Held back until the move to Spring Boot 3 (#66): the next major
      # versions of these need Java 11 or 17, or Spring Framework 6 or 7
      # (#91). Remove these rules with #66
      - dependency-name: org.springframework.security:*
        update-types: ["version-update:semver-major"]
      - dependency-name: com.github.tomakehurst:wiremock
        update-types: ["version-update:semver-major"]
      # Java 11 from 7.0
      - dependency-name: org.openapitools:openapi-generator-maven-plugin
        versions: [">= 7"]
    groups:
      maven:
        patterns: ["*"]
  # Actions in the workflows, including the pins of the shared actions of
  # `elixir-cloud-aai/.github`
  - package-ecosystem: github-actions
    labels: ["type: dependencies"]
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  # Base images in the `Dockerfile` (tag and digest). Java 21 (LTS), as in
  # `pom.xml` and the CI job `Test`: a new major version of Java is a
  # decision of its own
  - package-ecosystem: docker
    labels: ["type: dependencies"]
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
  # Dependencies of the docs (`docs/requirements.txt`)
  - package-ecosystem: pip
    labels: ["type: dependencies"]
    directory: /docs
    schedule:
      interval: monthly
    groups:
      docs-dependencies:
        patterns: ["*"]
