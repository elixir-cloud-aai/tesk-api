version: 2
# Every entry targets `dev` (`target-branch`), which takes all pull requests
# whatever the default branch is (`main` only moves forward to releases);
# security updates always target the default branch, though
updates:
  # Dependencies in `pom.xml`. Java 8 and Spring Boot 2 stay until the move to
  # Spring Boot 3, which needs code changes
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    ignore:
      - dependency-name: org.springframework.boot:*
        update-types: ["version-update:semver-major"]
      # Held back until the move to Spring Boot 3 (#66): the next major
      # versions of these need Java 11 or 17, or Spring Framework 6 or 7
      # (#91). Remove these rules with #66
      - dependency-name: io.kubernetes:client-java
        update-types: ["version-update:semver-major"]
      - dependency-name: org.springframework.security:*
        update-types: ["version-update:semver-major"]
      - dependency-name: com.github.tomakehurst:wiremock
        update-types: ["version-update:semver-major"]
      # Java 11 from 7.0
      - dependency-name: org.openapitools:openapi-generator-maven-plugin
        versions: [">= 7"]
    groups:
      maven:
        patterns: ["*"]
  # Actions in the workflows, including the pins of the shared actions of
  # `elixir-cloud-aai/.github`
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      github-actions:
        patterns: ["*"]
  # Base images in the `Dockerfile` (tag and digest). Java 8 stays until the
  # move to Spring Boot 3
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    target-branch: dev
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
  # Dependencies of the docs (`docs/requirements.txt`)
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: monthly
    target-branch: dev
    groups:
      docs-dependencies:
        patterns: ["*"]
