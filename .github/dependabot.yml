version: 2
# No entry sets `target-branch`: pull requests go to the default branch
# (`dev`) anyway, and while `target-branch` is set, GitHub doesn't apply
# the entry's options (`labels`, `ignore`, ...) to security updates
updates:
  # Dependencies in `pom.xml`. A new major version of Spring Boot needs code
  # changes, and so is a decision of its own
  - package-ecosystem: maven
    labels: ["type: dependencies"]
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: org.springframework.boot:*
        update-types: ["version-update:semver-major"]
    groups:
      maven:
        patterns: ["*"]
  # Actions in the workflows, including the pins of the shared actions of
  # `elixir-cloud-aai/.github`
  - package-ecosystem: github-actions
    labels: ["type: dependencies"]
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
  # Base images in the `Dockerfile` (tag and digest). Java 21 (LTS), as in
  # `pom.xml` and the CI job `Test`: a new major version of Java is a
  # decision of its own
  - package-ecosystem: docker
    labels: ["type: dependencies"]
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
  # Dependencies of the docs (`docs/requirements.txt`)
  - package-ecosystem: pip
    labels: ["type: dependencies"]
    directory: /docs
    schedule:
      interval: monthly
    groups:
      docs-dependencies:
        patterns: ["*"]
