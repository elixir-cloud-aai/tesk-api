# Codecov settings (https://docs.codecov.com/docs/codecov-yaml), for the
# JaCoCo reports of the unit and integration tests together: the project and
# the changes of each pull request must be covered completely (lines and
# branches; partly covered lines count as missed), as in the other
# repositories of the organization. `./mvnw verify` fails before that already
# (`check` of `jacoco-maven-plugin` in `pom.xml`, which also lists the
# generated code that isn't measured)
coverage:
  status:
    project:
      default:
        target: 100%
    patch:
      default:
        target: 100%
